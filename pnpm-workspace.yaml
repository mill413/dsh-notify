# pnpm settings for this single-package repository. Every dependency comes from
# npm; no workspace members are declared.
allowBuilds:
  esbuild: true
  # SDK native runtime providers are not needed to build this plugin.
  koffi: false
  node-pty: false

# Build dependencies use the exact npm versions declared in package.json.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
