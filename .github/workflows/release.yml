name: Test, build and publish

on:
  pull_request:
  push:
    branches: [dev, release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm test
      - run: pnpm run test:release
      - run: pnpm run build
      - run: pnpm run pack:release
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: npm-package
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on the release branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.2 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish verified package
        run: node scripts/publish-release.mjs
