name: build-and-release

on:
  push:
    branches: [dev, release]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Gitea base URL
        run: |
          set -eu
          for h in 172.17.0.1 host.docker.internal 192.168.31.76 127.0.0.1; do
            if curl -fsS -m 3 "http://$h:3000/api/v1/version" >/dev/null 2>&1; then
              echo "GITEA_HOST=$h" >> "$GITHUB_ENV"
              echo "GITEA_BASE=http://$h:3000" >> "$GITHUB_ENV"
              echo "using $h:3000"
              exit 0
            fi
          done
          echo "cannot reach the Gitea instance from the job container" >&2
          exit 1

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://oauth2:${GITHUB_TOKEN}@${GITEA_HOST}:3000/${GITHUB_REPOSITORY}.git" .
          git log -1 --format='%h %s'

      - name: Toolchain
        run: |
          set -eu
          node -v
          npm i -g pnpm@11 >/dev/null
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify (typecheck)
        run: pnpm run verify

      - name: Test
        run: pnpm test

      - name: Pack and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_BASE: ${{ env.GITEA_BASE }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          npm pack
          TGZ=$(ls -1 ./*.tgz | head -1)
          ls -l "$TGZ"
          TGZ="$TGZ" node .gitea/release.mjs
