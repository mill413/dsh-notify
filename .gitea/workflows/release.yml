name: build-and-release

on:
  push:
    branches: [dev, release]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Legacy Gitea publishing; set a runner-reachable URL in repository variables.
      - name: Resolve Gitea base URL
        env:
          GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
        run: |
          set -eu
          : "${GITEA_BASE_URL:?Set the GITEA_BASE_URL repository variable}"
          curl -fsS -m 5 "$GITEA_BASE_URL/api/v1/version" >/dev/null
          echo "GITEA_BASE=${GITEA_BASE_URL%/}" >> "$GITHUB_ENV"

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          AUTH=$(printf 'oauth2:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $AUTH" \
            git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITEA_BASE}/${GITHUB_REPOSITORY}.git" .
          git log -1 --format='%h %s'

      - name: Toolchain
        run: |
          set -eu
          node -v
          npm i -g pnpm@12.15.0 >/dev/null
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify (typecheck)
        run: pnpm run verify

      - name: Test
        run: pnpm test

      - name: Pack and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_BASE: ${{ env.GITEA_BASE }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          npm pack --json > /tmp/dsh-notify-pack.json
          TGZ=$(node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync("/tmp/dsh-notify-pack.json", "utf8")); console.log((Array.isArray(result) ? result : Object.values(result))[0].filename)')
          ls -l "$TGZ"
          TGZ="$TGZ" node .gitea/release.mjs
